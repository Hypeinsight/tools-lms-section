          { action: 'url', url: moduleConfig.baseUrl + '/tools/safety-overview-eliminate-falls-risk-ncc2022.2-1.2?menu_id=5-0&shareId=ch6ODI-1760939760336&zoom=1.718186179831921&x=690.7910227361785&y=342.34938846540183&standard=&standard=&action=click&action=click&type=0&type=0', x: 201, y: 427.957, w: 127, h: 14.426 },
          { action: 'url', url: moduleConfig.baseUrl + '/tools/safety-overview-eliminate-falls-risk-ncc2022.2-1.2?menu_id=5-0&shareId=ch6ODI-1760939760336&zoom=2.252191588960825&x=516.0388093943355&y=479.79640486986284&standard=&action=click&type=0&standard=&action=click&type=0', x: 267, y: 464.021, w: 159, h: 8.014 },
          { action: 'url', url: moduleConfig.baseUrl + '/tools/safety-overview-ppe-falls-risk-ncc2022.2-1.11?r=1&x=553.5191071015145&y=240.21599730372742&zoom=1&shareId=ch6ODI-1760939760336&standard=,&menu_id=5-0&standard=&action=click&type=0', x: 396, y: 483.255, w: 36, h: 15.227 },
          { action: 'url', url: moduleConfig.baseUrl + '/tools/safety-overview-eliminate-exposure-risk-ncc2022.2-1.3?point=ed3d0eb3-429d-4a5a-8132-288c9d04203d&shareId=ch6ODI-1760939760336&standard=&zoom=2.1048519522998363&x=817.2833008898259&y=253.90880842957762&action=click&type=1', x: 382, y: 536.950, w: 70, h: 20.035 },
          { action: 'back', x: 52, y: 924.035, w: 153, h: 43.277 },
          { action: 'next', x: 1184, y: 920.830, w: 198, h: 48.085 }
        ]
      },
      {
        id: 12,
        file: '{{ module.slide_12.svg_path }}',
        viewBoxWidth: {{ module.slide_12.viewbox_width }},
        viewBoxHeight: {{ module.slide_12.viewbox_height }},
        overlays: [
          { action: 'back', x: 92.5, y: 54.835, w: 58, h: 38.019 },
          { action: 'next', x: 1285.5, y: 57.028, w: 61, h: 37.288 },
          { action: 'video', src: '{{ module.slide_12.video_url }}', x: 1215.5, y: 157.924, w: 168, h: 41.674 },
          { action: 'url', url: moduleConfig.baseUrl + '/tools/masonry-veneer-brickwork-blockwork-ncc2022.2-1.41?menu_id=2-4-4&shareId=ch6ODI-1768980167021&zoom=1.4025517307000004&x=581.4008686135728&y=250.09848958885175&standard=&action=click&type=0', x: 58.500, y: 577.592, w: 124.000, h: 11.698 },
          { action: 'url', url: moduleConfig.baseUrl + '/tools/cladding-weatherboard-panelling-ncc2022.2-1.25?menu_id=2-1-0&shareId=ch6ODI-1768980167021&zoom=1.3107960100000002&x=565.9475835831998&y=232.49417346029307&standard=&action=click&type=0', x: 495.500, y: 577.592, w: 70.000, h: 15.354 },
          { action: 'url', url: moduleConfig.baseUrl + '/tools/fabric-metal-cladding-ncc2022.2-1.5?menu_id=2-1-1&shareId=ch6ODI-1768980203586&zoom=1&x=512&y=288&standard=&action=click&type=0', x: 920.500, y: 575.398, w: 120.000, h: 20.472 },
          { action: 'back', x: 52.5, y: 945.349, w: 152, h: 40.212 },
          { action: 'next', x: 1149.5, y: 939.500, w: 235, h: 44.599 }
        ]
      },
      {
        id: 13,
        file: '{{ module.slide_13.svg_path }}',
        viewBoxWidth: {{ module.slide_13.viewbox_width }},
        viewBoxHeight: {{ module.slide_13.viewbox_height }},
        overlays: [
          { action: 'back', x: 91, y: 105.117, w: 57, h: 60.994 },
          { action: 'url', url: '{{ module.slide_13.final_url }}', x: 615, y: 669.633, w: 205, h: 76.567 },
          { action: 'back', x: 60, y: 917, w: 142, h: 56 }
        ]
      }
    ]
  };

  // Build components array from configuration
  const components = moduleConfig.slides.map(slide => ({
    ...slide,
    overlays: slide.overlays || []
  }));

  // HubSpot tracking state
  const trackingState = {
    toolsClicked: 0,
    accordionsOpened: 0,
    showMeClicked: 0,
    highestSlideViewed: 1
  };

  // HubSpot tracking functions
  function updateHubSpotProperty(propertyName, value) {
    if (typeof window._hsq !== 'undefined') {
      const properties = {};
      properties[propertyName] = value;
      window._hsq.push(['identify', properties]);
    }
  }

  function trackSlideView(slideNumber) {
    if (slideNumber > trackingState.highestSlideViewed) {
      trackingState.highestSlideViewed = slideNumber;
      updateHubSpotProperty(moduleConfig.trackingPrefix + '_implementation_last_slide_viewed', slideNumber);
    }
  }

  function trackToolClick() {
    trackingState.toolsClicked++;
    updateHubSpotProperty(moduleConfig.trackingPrefix + '_implementation_tools_clicked', trackingState.toolsClicked);
  }

  function trackAccordionOpen() {
    trackingState.accordionsOpened++;
    updateHubSpotProperty(moduleConfig.trackingPrefix + '_implementation_accordions_opened', trackingState.accordionsOpened);
  }

  function trackShowMeClick() {
    trackingState.showMeClicked++;
    updateHubSpotProperty(moduleConfig.trackingPrefix + '_implementation_show_me_clicked', trackingState.showMeClicked);
  }

  function trackImplementationComplete() {
    updateHubSpotProperty(moduleConfig.trackingPrefix + '_implementation_completed', 'true');
    updateHubSpotProperty(moduleConfig.trackingPrefix + '_implementation_completion_date', new Date().toISOString());
  }

  // State management
  const state = {
    index: 0,
    loaded: new Array(components.length).fill(false),
    viewBox: new Array(components.length).fill(null),
    accordion: {}
  };

  // Build DOM
  function buildDOM() {
    components.forEach((c, i) => {
      const comp = document.createElement('div');
      comp.className = 'component' + (i === 0 ? ' active' : '');
      comp.dataset.idx = i;

      const host = document.createElement('div');
      host.className = 'svg-host' + (c.accordions ? ' accordion-slide' : '');

      const img = document.createElement('img');
      img.src = c.file;
      img.setAttribute('aria-label', `Slide ${c.id}`);

      const overlays = document.createElement('div');
      overlays.className = 'overlay-root';

      host.appendChild(img);
      host.appendChild(overlays);
      comp.appendChild(host);
      container.appendChild(comp);

      state.viewBox[i] = { w: c.viewBoxWidth || 1440, h: c.viewBoxHeight || 2500 };
      
      img.addEventListener('load', () => {
        state.loaded[i] = true;
        if (c.accordions && !state.accordion[i]) {
          state.accordion[i] = {};
          c.accordions.forEach(acc => { state.accordion[i][acc.id] = false; });
        }
        renderOverlays(i);
      });
    });
  }

  function renderOverlays(idx) {
    const compEl = container.querySelector(`.component[data-idx="${idx}"]`);
    if (!compEl) return;
    const root = compEl.querySelector('.overlay-root');
    root.innerHTML = '';
    const host = compEl.querySelector('.svg-host');
    const current = components[idx];
    
    // Calculate dynamic height for accordion slides
    if (current.accordions) {
      const headerHeight = 290;
      const overviewSectionHeight = 1784;
      const spacingAfterAccordions = 150;
      const bottomNavHeight = 200;
      const bottomPadding = 50;
      
      let accordionTotalHeight = 0;
      current.accordions.forEach((acc) => {
        const expanded = state.accordion[idx] && state.accordion[idx][acc.id];
        accordionTotalHeight += expanded ? acc.hE : acc.hC;
      });
      
      const dynamicHeight = headerHeight + accordionTotalHeight + spacingAfterAccordions + overviewSectionHeight + bottomNavHeight + bottomPadding;
      
      state.viewBox[idx].h = dynamicHeight;
      components[idx].viewBoxHeight = dynamicHeight;
      
      const hostRect = host.getBoundingClientRect();
      const scale = hostRect.width / (current.viewBoxWidth || 1440);
      const dynamicHeightPx = dynamicHeight * scale;
      host.style.height = dynamicHeightPx + 'px';
    }
    
    const vb = state.viewBox[idx];
    if (!vb) return;

    // Dynamically position bottom section on slide 3
    if (idx === 2 && current.accordions) {
      const hostRect = host.getBoundingClientRect();
      const scale = hostRect.width / vb.w;
      
      let accordionTotalHeight = 0;
      current.accordions.forEach((acc) => {
        const expanded = state.accordion[idx] && state.accordion[idx][acc.id];
        accordionTotalHeight += expanded ? acc.hE : acc.hC;
      });
      
      const headerHeight = 290;
      const accordionsEndY = headerHeight + accordionTotalHeight;
      const spacing = 150;
      const bottomSectionY = accordionsEndY + spacing;
      
      // Render Overview section
      const overviewImgEl = document.createElement('img');
      overviewImgEl.src = 'EDU Practical Guide (Implementation)/Frame 90.svg';
      overviewImgEl.style.position = 'absolute';
      overviewImgEl.style.left = (80 * scale) + 'px';
      overviewImgEl.style.top = (bottomSectionY * scale) + 'px';
      overviewImgEl.style.width = (1281 * scale) + 'px';
      overviewImgEl.style.height = (1784 * scale) + 'px';
      overviewImgEl.style.pointerEvents = 'none';
      overviewImgEl.style.zIndex = '10';
      root.appendChild(overviewImgEl);
      
      // Render bottom navigation
      const bottomNavY = bottomSectionY + 1784;
      const bottomNavImgEl = document.createElement('img');
      bottomNavImgEl.src = 'EDU Practical Guide (Implementation)/TAFE Implementation/Bottom buttons/Frame 271.svg';
      bottomNavImgEl.style.position = 'absolute';
      bottomNavImgEl.style.left = (80 * scale) + 'px';
      bottomNavImgEl.style.top = (bottomNavY * scale) + 'px';
      bottomNavImgEl.style.width = (1281 * scale) + 'px';
      bottomNavImgEl.style.height = (200 * scale) + 'px';
      bottomNavImgEl.style.pointerEvents = 'none';
      bottomNavImgEl.style.zIndex = '10';
      root.appendChild(bottomNavImgEl);
      
      // Add clickable overlays for navigation buttons
      const bottomBackBtn = document.createElement('div');
      bottomBackBtn.className = 'click-area';
      bottomBackBtn.style.position = 'absolute';
      bottomBackBtn.style.left = (75.5 * scale) + 'px';
      bottomBackBtn.style.top = ((bottomNavY + (2762 - bottomNavY)) * scale) + 'px';
      bottomBackBtn.style.width = (146 * scale) + 'px';
      bottomBackBtn.style.height = (42 * scale) + 'px';
      bottomBackBtn.style.pointerEvents = 'auto';
      bottomBackBtn.style.cursor = 'pointer';
      bottomBackBtn.style.zIndex = '20';
      bottomBackBtn.title = 'BACK';
      bottomBackBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); goTo(state.index - 1); });
      root.appendChild(bottomBackBtn);
      
      const bottomNextBtn = document.createElement('div');
      bottomNextBtn.className = 'click-area';
      bottomNextBtn.style.position = 'absolute';
      bottomNextBtn.style.left = (1184.5 * scale) + 'px';
      bottomNextBtn.style.top = ((bottomNavY + (2758 - bottomNavY)) * scale) + 'px';
      bottomNextBtn.style.width = (180 * scale) + 'px';
      bottomNextBtn.style.height = (46 * scale) + 'px';
      bottomNextBtn.style.pointerEvents = 'auto';
      bottomNextBtn.style.cursor = 'pointer';
      bottomNextBtn.style.zIndex = '20';
      bottomNextBtn.title = 'NEXT';
      bottomNextBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); goTo(state.index + 1); });
      root.appendChild(bottomNextBtn);
    }

    // Render accordions
    if (current.accordions) {
      const hostRect = host.getBoundingClientRect();
      const scale = hostRect.width / vb.w;
      const accordionLeftPx = 80 * scale;
      const accordionWidthPx = 1281 * scale;
      
      let offset = 0;
      current.accordions.forEach((acc) => {
        const expanded = state.accordion[idx] && state.accordion[idx][acc.id];
        const y = acc.y + offset;
        const h = expanded ? acc.hE : acc.hC;

        const imgEl = document.createElement('img');
        imgEl.src = expanded ? acc.expanded : acc.collapsed;
        imgEl.style.position = 'absolute';
        imgEl.style.left = accordionLeftPx + 'px';
        imgEl.style.top = (y * scale) + 'px';
        imgEl.style.width = accordionWidthPx + 'px';
        imgEl.style.height = (h * scale) + 'px';
        imgEl.style.pointerEvents = 'none';
        imgEl.style.zIndex = '10';
        imgEl.setAttribute('aria-label', acc.id);
        root.appendChild(imgEl);

        const toggleEl = document.createElement('div');
        toggleEl.style.position = 'absolute';
        toggleEl.style.left = accordionLeftPx + 'px';
        toggleEl.style.top = (y * scale) + 'px';
        toggleEl.style.width = accordionWidthPx + 'px';
        toggleEl.style.height = (62 * scale) + 'px';
        toggleEl.style.cursor = 'pointer';
        toggleEl.style.pointerEvents = 'auto';
        toggleEl.style.background = 'transparent';
        toggleEl.style.zIndex = '11';
        toggleEl.dataset.accordionId = acc.id;
        toggleEl.addEventListener('click', ((accordionId, currentExpanded) => {
          return (e) => {
            e.stopPropagation();
            if (!state.accordion[idx]) state.accordion[idx] = {};
            state.accordion[idx][accordionId] = !currentExpanded;
            if (!currentExpanded) {
              trackAccordionOpen();
            }
            renderOverlays(idx);
          };
        })(acc.id, expanded));
        root.appendChild(toggleEl);

        if (expanded && acc.links) {
          acc.links.forEach((link) => {
            const linkEl = document.createElement('a');
            linkEl.href = link.url;
            linkEl.target = '_blank';
            linkEl.style.position = 'absolute';
            linkEl.style.left = (accordionLeftPx + (link.x * scale)) + 'px';
            linkEl.style.top = ((y + link.y) * scale) + 'px';
            linkEl.style.width = (link.w * scale) + 'px';
            linkEl.style.height = (link.h * scale) + 'px';
            linkEl.style.pointerEvents = 'auto';
            linkEl.style.cursor = 'pointer';
            linkEl.style.zIndex = '12';
            linkEl.style.display = 'block';
            linkEl.addEventListener('click', () => {
              trackToolClick();
            });
            root.appendChild(linkEl);
          });
        }

        offset += (h - acc.hC);
      });
    }
    
    // Render regular overlays
    if (current.overlays) {
      current.overlays.forEach((o) => {
        if (o.action === 'gif') {
          const gifEl = document.createElement('img');
          gifEl.src = o.url;
          gifEl.style.position = 'absolute';
          gifEl.style.left = (o.x / vb.w) * 100 + '%';
          gifEl.style.top = (o.y / vb.h) * 100 + '%';
          gifEl.style.width = (o.w / vb.w) * 100 + '%';
          gifEl.style.height = (o.h / vb.h) * 100 + '%';
          gifEl.style.borderRadius = '32px';
          gifEl.style.objectFit = 'cover';
          gifEl.style.pointerEvents = 'none';
          gifEl.style.zIndex = '10';
          root.appendChild(gifEl);
          return;
        }
        
        const el = document.createElement('div');
        el.className = 'click-area';
        
        let yPos = o.y;
        
        if (o.dynamicY && current.accordions) {
          let totalOffset = 0;
          current.accordions.forEach((acc) => {
            const expanded = state.accordion[idx] && state.accordion[idx][acc.id];
            if (expanded) {
              totalOffset += (acc.hE - acc.hC);
            }
          });
          yPos = o.y + totalOffset;
        }
        
        el.style.left = (o.x / vb.w) * 100 + '%';
        el.style.top = (yPos / vb.h) * 100 + '%';
        el.style.width = (o.w / vb.w) * 100 + '%';
        el.style.height = (o.h / vb.h) * 100 + '%';
        el.title = o.action.toUpperCase();

        el.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          handleAction(o);
        });

        root.appendChild(el);
      });
    }
  }

  function handleAction(o) {
    if (o.action === 'next') {
      goTo(state.index + 1);
    } else if (o.action === 'back') {
      goTo(state.index - 1);
    } else if (o.action === 'url' && o.url) {
      if (o.url.includes('.buildingtools.co')) {
        trackToolClick();
      }
      window.open(o.url, '_blank', 'noopener');
    } else if (o.action === 'video' && o.src) {
      trackShowMeClick();
      showVideoModal(o.src);
    }
  }

  function showVideoModal(src) {
    const modal = document.getElementById('videoModal-' + moduleId);
    const video = document.getElementById('modalVideo-' + moduleId);
    const source = document.getElementById('modalVideoSource-' + moduleId);
    const extension = src.split('.').pop().toLowerCase();
    source.type = extension === 'webm' ? 'video/webm' : 'video/mp4';
    source.src = src;
    video.load();
    modal.classList.add('active');
  }

  function closeVideoModal() {
    const modal = document.getElementById('videoModal-' + moduleId);
    const video = document.getElementById('modalVideo-' + moduleId);
    video.pause();
    modal.classList.remove('active');
  }

  function goTo(newIndex) {
    const max = components.length - 1;
    const clamped = Math.max(0, Math.min(max, newIndex));
    if (clamped === state.index) return;
    
    const prev = container.querySelector(`.component[data-idx="${state.index}"]`);
    const next = container.querySelector(`.component[data-idx="${clamped}"]`);
    if (prev) prev.classList.remove('active');
    if (next) next.classList.add('active');
    state.index = clamped;
    
    if (state.viewBox[clamped]) renderOverlays(clamped);
    trackSlideView(clamped + 1);
    if (clamped === max) trackImplementationComplete();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function hookKeyboard() {
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        goTo(state.index + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        goTo(state.index - 1);
      } else if (e.key === 'Escape') {
        closeVideoModal();
      }
    });
  }

  function hookVideoModal() {
    const videoModal = document.getElementById('videoModal-' + moduleId);
    const closeVideoBtn = document.getElementById('closeVideoModal-' + moduleId);
    
    closeVideoBtn.addEventListener('click', closeVideoModal);
    videoModal.addEventListener('click', (e) => {
      if (e.target === videoModal) {
        closeVideoModal();
      }
    });
  }

  // Initialize
  buildDOM();
  hookKeyboard();
  hookVideoModal();
  
  window.addEventListener('load', () => {
    trackSlideView(1);
  });

})();
</script>
