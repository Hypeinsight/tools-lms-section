    html, body { margin: 0; padding: 0; background:transparent; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:#111; }
    .page { display:flex; justify-content:center; padding:0; }
    .container { position:relative; width:100%; max-width: var(--max-w); background:#DAE5F1; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,0.25); }

    .component { display:none; position:relative; background:#DAE5F1; }
    .component.active { display:block; }

    .svg-host { position:relative; width:100%; display:block; background:#DAE5F1; }
    .svg-host img { width:100%; height:auto; display:block; }
    .svg-host.dynamic-height { height: auto; min-height: 100%; }

    /* overlay root sits above the image in the svg-host */
    .overlay-root { position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none; z-index:10; }
    .click-area { position:absolute; border-radius:8px; pointer-events:auto; cursor:pointer; }
    .video-embed { position:absolute; pointer-events:auto; border:none; border-radius:24px; }
    .image-embed { position:absolute; pointer-events:none; border-radius:32px; }
    
    /* Accordion */
    .accordion-item {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      transition: top 0.3s ease;
    }
    
    .accordion-item img {
      width: 100%;
      height: auto;
      display: block;
    }
    
  </style>

    const state = { index: 0, viewBox: {}, loaded: {} };
    const container = document.querySelector('.container');

    function buildDOM() {
      components.forEach((c, i) => {
        const comp = document.createElement('div');
        comp.className = i === 0 ? 'component active' : 'component';
        comp.setAttribute('data-idx', i);

        const host = document.createElement('div');
        host.className = 'svg-host';

        const img = document.createElement('img');
        img.src = c.file;
        img.alt = `Slide ${c.id}`;

        const overlays = document.createElement('div');
        overlays.className = 'overlay-root';

        host.appendChild(img);
        host.appendChild(overlays);
        comp.appendChild(host);
        container.appendChild(comp);

        state.viewBox[i] = { w: c.viewBoxWidth || 1440, h: c.viewBoxHeight || 1000 };
        
        img.addEventListener('load', () => {
          state.loaded[i] = true;
          renderOverlays(i);
        });
      });
    }

    function renderOverlays(idx) {
      const compEl = container.querySelector(`.component[data-idx="${idx}"]`);
      if (!compEl) return;
      const root = compEl.querySelector('.overlay-root');
      root.innerHTML = '';
      const vb = state.viewBox[idx];
      if (!vb) return;

      // Render videos
      if (components[idx].videos) {
        components[idx].videos.forEach((v) => {
          const videoEl = document.createElement('video');
          videoEl.className = 'video-embed';
          videoEl.controls = true;
          videoEl.style.left = (v.x / vb.w) * 100 + '%';
          videoEl.style.top = (v.y / vb.h) * 100 + '%';
          videoEl.style.width = (v.w / vb.w) * 100 + '%';
          videoEl.style.height = (v.h / vb.h) * 100 + '%';
          
          const source = document.createElement('source');
          source.src = v.src;
          source.type = 'video/mp4';
          videoEl.appendChild(source);
          
          root.appendChild(videoEl);
        });
      }
      
      // Render overlays first
      components[idx].overlays.forEach((o) => {
        const el = document.createElement('div');
        el.className = 'click-area';
        if (o.dynamic) el.classList.add('dynamic-overlay');
        
        el.style.left = (o.x / vb.w) * 100 + '%';
        if (o.dynamic && components[idx].accordion) {
          // For dynamic overlays on accordion slides, use pixel positioning
          el.style.top = o.y + 'px';
        } else {
          el.style.top = (o.y / vb.h) * 100 + '%';
        }
        el.style.width = (o.w / vb.w) * 100 + '%';
        el.style.height = (o.h / vb.h) * 100 + '%';
        el.title = o.action.toUpperCase();

        el.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          handleAction(o);
        });

        root.appendChild(el);
      });
      
      // Render accordion after overlays
      if (components[idx].accordion) {
        renderAccordion(idx, root, vb);
      }
    }

    function renderAccordion(idx, root, vb) {
      const accordion = components[idx].accordion;
      let currentY = accordion.startY;
      
      accordion.items.forEach((item, itemIdx) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'accordion-item';
        itemEl.setAttribute('data-accordion-idx', itemIdx);
        itemEl.style.left = (accordion.itemX / vb.w) * 100 + '%';
        itemEl.style.top = currentY + 'px';
        itemEl.style.width = (accordion.itemWidth / vb.w) * 100 + '%';
        
        const img = document.createElement('img');
        img.src = item.open ? item.openSrc : item.closedSrc;
        itemEl.appendChild(img);
        
        itemEl.addEventListener('click', () => toggleAccordion(idx, itemIdx));
        
        root.appendChild(itemEl);
        
        // Render links if accordion is open
        if (item.open && item.links) {
          item.links.forEach(link => {
            const linkEl = document.createElement('a');
            linkEl.href = link.url;
            linkEl.target = '_blank';
            linkEl.className = 'click-area accordion-link';
            linkEl.style.position = 'absolute';
            linkEl.style.left = ((accordion.itemX + link.x) / vb.w) * 100 + '%';
            linkEl.style.top = (currentY + link.y) + 'px';
            linkEl.style.width = (link.w / vb.w) * 100 + '%';
            linkEl.style.height = link.h + 'px';
            linkEl.style.zIndex = '35';
            linkEl.style.pointerEvents = 'auto';
            linkEl.style.cursor = 'pointer';
            linkEl.title = 'Open Tool';
            linkEl.addEventListener('click', (e) => {
              e.stopPropagation();
            });
            root.appendChild(linkEl);
          });
        }
        
        const height = item.open ? item.openHeight : item.closedHeight;
        currentY += height + accordion.spacing;
      });
      
      // Render nav section image
      const navEl = document.createElement('img');
      navEl.className = 'accordion-nav';
      navEl.src = accordion.navSrc;
      navEl.style.position = 'absolute';
      navEl.style.left = (accordion.navX / vb.w) * 100 + '%';
      navEl.style.width = (accordion.navWidth / vb.w) * 100 + '%';
      navEl.style.zIndex = '25';
      navEl.style.transition = 'top 0.3s ease';
      root.appendChild(navEl);
      
      // Add clickable areas on nav
      const backBtn = document.createElement('div');
      backBtn.className = 'click-area nav-btn';
      backBtn.style.position = 'absolute';
      backBtn.style.left = (58 / vb.w) * 100 + '%';
      backBtn.style.width = (180 / vb.w) * 100 + '%';
      backBtn.style.height = '56px';
      backBtn.style.zIndex = '30';
      backBtn.style.transition = 'top 0.3s ease';
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        handleAction({ action: 'back' });
      });
      root.appendChild(backBtn);
      
      const nextBtn = document.createElement('div');
      nextBtn.className = 'click-area nav-btn';
      nextBtn.style.position = 'absolute';
      nextBtn.style.left = (1202 / vb.w) * 100 + '%';
      nextBtn.style.width = (180 / vb.w) * 100 + '%';
      nextBtn.style.height = '56px';
      nextBtn.style.zIndex = '30';
      nextBtn.style.transition = 'top 0.3s ease';
      nextBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        handleAction({ action: 'next' });
      });
      root.appendChild(nextBtn);
      
      // Initial height calculation and nav button positioning
      updateSlideHeight(idx);
    }
    
    function toggleAccordion(slideIdx, itemIdx) {
      const accordion = components[slideIdx].accordion;
      accordion.items[itemIdx].open = !accordion.items[itemIdx].open;
      
      renderOverlays(slideIdx);
    }
    
    function updateSlideHeight(idx) {
      const accordion = components[idx].accordion;
      if (!accordion) return;
      
      let totalHeight = accordion.startY;
      
      accordion.items.forEach((item, i) => {
        const height = item.open ? item.openHeight : item.closedHeight;
        totalHeight += height;
        if (i < accordion.items.length - 1) {
          totalHeight += accordion.spacing;
        }
      });
      
      // Add spacing before nav buttons
      totalHeight += accordion.spacing * 2;
      
      // Add nav button height
      totalHeight += accordion.navHeight;
      
      // Add bottom padding
      totalHeight += 60;
      
      // Update viewBox height
      state.viewBox[idx].h = totalHeight;
      components[idx].viewBoxHeight = totalHeight;
      
      // Update the actual container height
      const compEl = container.querySelector(`.component[data-idx="${idx}"]`);
      const svgHost = compEl ? compEl.querySelector('.svg-host') : null;
      const overlayRoot = compEl ? compEl.querySelector('.overlay-root') : null;
      
      if (svgHost) {
        svgHost.style.height = totalHeight + 'px';
      }
      
      if (overlayRoot) {
        overlayRoot.style.height = totalHeight + 'px';
      }
      
      // Update nav section and button positions
      if (compEl) {
        const navImg = compEl.querySelector('.accordion-nav');
        const navButtons = compEl.querySelectorAll('.nav-btn');
        const navY = totalHeight - accordion.navHeight - 40;
        
        if (navImg) {
          navImg.style.top = navY + 'px';
        }
        
        navButtons.forEach(btn => {
          btn.style.top = (navY + 53) + 'px';
        });
      }
      
      // Reposition accordion items with animation
      const root = container.querySelector(`.component[data-idx="${idx}"] .overlay-root`);
      if (!root) return;
      
      let currentY = accordion.startY;
      accordion.items.forEach((item, itemIdx) => {
        const itemEl = root.querySelector(`.accordion-item[data-accordion-idx="${itemIdx}"]`);
        if (itemEl) {
          itemEl.style.top = currentY + 'px';
          const img = itemEl.querySelector('img');
          img.src = item.open ? item.openSrc : item.closedSrc;
        }
        const height = item.open ? item.openHeight : item.closedHeight;
        currentY += height + accordion.spacing;
      });
      
      // Notify parent of height change after accordion animation
      setTimeout(() => {
        notifyParentHeight();
      }, 350);
    }

    function handleAction(o) {
      if (o.action === 'next') {
        goTo(state.index + 1);
      } else if (o.action === 'back') {
        goTo(state.index - 1);
      } else if (o.action === 'url' && o.url) {
        window.open(o.url, '_blank', 'noopener');
      } else if (o.action === 'image' && o.image) {
        showImageModal(o.image);
      }
    }
    
    function showImageModal(imagePath) {
      // Create modal overlay
      const modal = document.createElement('div');
      modal.style.position = 'fixed';
      modal.style.top = '0';
      modal.style.left = '0';
      modal.style.width = '100%';
      modal.style.height = '100%';
      modal.style.backgroundColor = 'rgba(0, 0, 0, 0.9)';
      modal.style.zIndex = '10000';
      modal.style.display = 'flex';
      modal.style.alignItems = 'flex-start';
      modal.style.justifyContent = 'center';
      modal.style.padding = '20px';
      modal.style.overflow = 'auto';
      modal.style.cursor = 'pointer';
      
      // Create image
      const img = document.createElement('img');
      img.src = imagePath;
      img.style.maxWidth = '100%';
      img.style.height = 'auto';
      img.style.display = 'block';
      img.style.margin = '0 auto';
      
      modal.appendChild(img);
      document.body.appendChild(modal);
      
      // Scroll modal to top
      modal.scrollTop = 0;
      
      // Close on click
      modal.addEventListener('click', () => {
        modal.remove();
      });
      
      // Close on Escape key
      const handleEscape = (e) => {
        if (e.key === 'Escape') {
          modal.remove();
          document.removeEventListener('keydown', handleEscape);
        }
      };
      document.addEventListener('keydown', handleEscape);
    }

    function goTo(newIndex) {
      const max = components.length - 1;
      const clamped = Math.max(0, Math.min(max, newIndex));
      if (clamped === state.index) return;
      
      const prev = container.querySelector(`.component[data-idx="${state.index}"]`);
      const next = container.querySelector(`.component[data-idx="${clamped}"]`);
      if (prev) prev.classList.remove('active');
      if (next) next.classList.add('active');
      state.index = clamped;
      
      if (state.viewBox[clamped]) renderOverlays(clamped);
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
      
      // Notify parent about height change
      notifyParentHeight();
      
      // Scroll parent to top
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'scrollToTop' }, '*');
      }
    }
    
    function notifyParentHeight() {
      // Get the actual height of the content
      const activeComponent = container.querySelector('.component.active');
      if (!activeComponent) return;
      
      const height = activeComponent.scrollHeight || activeComponent.offsetHeight;
      const totalHeight = Math.max(height, 800); // Minimum height
      
      // Send height to parent window if embedded in iframe
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'resizeIframe',
          height: totalHeight + 100 // Add padding
        }, '*');
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goTo(state.index + 1);
      if (e.key === 'ArrowLeft') goTo(state.index - 1);
    });

    buildDOM();
    
    // Notify parent of initial height after images load
    window.addEventListener('load', () => {
      setTimeout(() => {
        notifyParentHeight();
      }, 500);
    });
    
    // Also notify on resize
    window.addEventListener('resize', () => {
      notifyParentHeight();
    });
  </script>
</body>
</html>
